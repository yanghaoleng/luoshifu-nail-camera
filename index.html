<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191817"><title>指间 · 美甲试色</title></head><body><video id="camera" autoplay playsinline muted></video><canvas id="view"></canvas><header><div class="brand">指间<span>NAIL CAMERA</span></div><button id="settings" aria-label="比较技术方案">方案 <i data-lucide="sliders-horizontal"></i></button></header><div id="status" role="status">正在打开后置相机…</div><div id="intro"><h1>把喜欢的颜色<br>戴在指尖</h1><p>手背朝向镜头，张开五指</p><button id="retry">开启相机</button><button id="demo">先看看效果</button></div><aside><div id="options"></div><nav><button data-tab="length" class="active"><i data-lucide="ruler"></i><span>长短</span></button><button data-tab="color"><i data-lucide="palette"></i><span>颜色</span></button><button data-tab="finish"><i data-lucide="sparkles"></i><span>质感</span></button></nav><button id="shutter" aria-label="拍照保存"><span></span></button></aside><footer><button id="mic"><i data-lucide="mic"></i><span>说一句，换个款</span></button><div id="selection"></div></footer><dialog id="lab"><div class="dialog-head"><h2>试一试不同方案</h2><button id="closeLab" aria-label="关闭"><i data-lucide="x"></i></button></div><p>同一只手，直接比较定位和光泽效果。</p><label>跟踪方式</label><div class="seg" id="tracking"><button data-value="landmark">关键点</button><button data-value="refine">边缘微调</button></div><label>渲染方式</label><div class="seg" id="rendering"><button data-value="flat">平面试色</button><button data-value="gloss">立体光泽</button></div><label>甲片宽度 <input id="width" type="range" min="0.6" max="1.4" step="0.05" value="1"></label><label>甲床位置 <input id="offset" type="range" min="0.15" max="0.65" step="0.025" value="0.38"></label><label class="check"><input id="debug" type="checkbox"> 显示定位点</label><p class="note">当前用手部关键点估算甲床，侧手、握拳、遮挡时精度会下降。边缘微调只做局部亮度边缘搜索，并非独立指甲分割模型。</p><button id="exitDemo">返回真实相机</button></dialog><dialog id="photo"><div class="dialog-head"><h2>这一款，留住了</h2><button id="closePhoto" aria-label="关闭"><i data-lucide="x"></i></button></div><img id="result" alt="美甲试戴照片"><button id="save">保存 / 分享照片</button><p class="note">iPhone 可在系统分享菜单中选择“存储图像”；也可长按照片保存。</p></dialog><script type="module" src="/src/main.js"></script></body></html>
