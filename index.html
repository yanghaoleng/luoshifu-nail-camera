<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191817"><link rel="icon" type="image/png" sizes="120x120" href="/nail/icons/luoshifu.png"><link rel="apple-touch-icon" sizes="180x180" href="/nail/icons/apple-touch-icon.png"><link rel="manifest" href="/nail/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="快速选款"><title>跟罗师傅快速选款</title></head><body><video id="camera" autoplay playsinline muted></video><canvas id="view"></canvas><header><div class="heading-group"><div class="brand"><span id="avatar" role="img" aria-label="罗师傅头像"></span>跟罗师傅快速选款</div><div class="title-meta"><div id="loading" role="status"><span id="loadingText">模型下载 0%</span></div><div id="selection"></div></div></div><button id="settings" aria-label="比较技术方案"><i data-lucide="sliders-horizontal"></i></button></header><div id="status" role="status">正在打开后置相机…</div><div id="intro"><h1>把喜欢的颜色<br>戴在指尖</h1><p>手背朝向镜头，张开五指</p><button id="retry">开启相机</button><button id="demo">先看看效果</button></div><aside><div id="options"></div><nav><button data-tab="length" class="active"><i data-lucide="ruler"></i><span>长短</span></button><button data-tab="color"><i data-lucide="palette"></i><span>颜色</span></button><button data-tab="finish"><i data-lucide="sparkles"></i><span>质感</span></button><button data-tab="style"><i data-lucide="gem"></i><span>款式</span></button></nav></aside><button id="shutter" aria-label="拍照保存"><span></span></button><footer><button id="mic" aria-label="暂停收音" aria-pressed="false"><i data-lucide="mic"></i></button><div id="transcript" role="status" aria-live="polite"></div></footer><dialog id="lab"><div class="dialog-head"><h2>试一试不同方案</h2><button id="closeLab" aria-label="关闭"><i data-lucide="x"></i></button></div><p>同一只手，直接比较定位和光泽效果。</p><label>渲染方式</label><div class="seg" id="rendering"><button data-value="flat">平面试色</button><button data-value="gloss">立体光泽</button></div><label>甲片宽度 <input id="width" type="range" min="0.6" max="1.4" step="0.05" value="1"></label><label>甲床位置 <input id="offset" type="range" min="0.15" max="0.65" step="0.025" value="0.38"></label><label>甲片大小 <input id="size" type="range" min="0.6" max="1.5" step="0.05" value="1"></label><label class="check"><input id="debug" type="checkbox"> 显示定位点</label><p class="note">当前用手部关键点估算甲床，侧手、握拳、遮挡时精度会下降。边缘微调只做局部亮度边缘搜索，并非独立指甲分割模型。</p><button id="exitDemo">返回真实相机</button></dialog><script type="module" src="/src/main.js"></script></body></html>
