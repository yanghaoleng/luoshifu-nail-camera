location = /nail { return 302 /nail/; }
location /nail/api/ {
    proxy_pass http://127.0.0.1:8796;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    client_max_body_size 512k;
    proxy_read_timeout 25s;
}
location ~ ^/nail/(models|wasm)/(.+)$ {
    alias /opt/nail-app/current/dist/$1/$2;
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /nail/ {
    alias /opt/nail-app/current/dist/;
    index index.html;
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;
}
